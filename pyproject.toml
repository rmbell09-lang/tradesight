[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradesight"
version = "1.2.0rc1"
description = "Self-hosted strategy research and broker-simulated paper-trading lab with explicit evidence gates."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ray Bell", email = "hello@tradesight.dev"},
]
keywords = [
    "algotrading",
    "paper-trading",
    "backtesting",
    "algorithmic-trading",
    "quantitative-finance",
    "trading-strategies",
    "ai-trading",
    "python-finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "flask>=3.1,<4",
    "numpy>=2.0,<3",
    "pandas>=2.3,<3",
    "TA-Lib>=0.6,<1",
    "yfinance>=1.2,<2",
    "websocket-client>=1.9,<2",
    "websockets>=15,<16",
]

[project.urls]
Homepage = "https://github.com/rmbell09-lang/TradeSight"
Repository = "https://github.com/rmbell09-lang/TradeSight"
"Bug Tracker" = "https://github.com/rmbell09-lang/TradeSight/issues"
Documentation = "https://github.com/rmbell09-lang/TradeSight#readme"

[project.scripts]
tradesight = "tradesight.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tradesight*"]
